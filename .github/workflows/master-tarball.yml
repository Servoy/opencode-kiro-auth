name: Build and publish tarball

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  tarball:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun test

      - run: bun run typecheck

      - run: bun run build

      # Bundel de runtime-deps ín dist/index.js in plaats van ze als
      # node_modules mee te packen. bundleDependencies leverde 7207 files /
      # 11 MB, wat opencode bij elke start opnieuw uitpakt en installeert.
      # @opencode-ai/plugin blijft extern: opencode levert die runtime.
      - name: Bundle runtime dependencies into a single file
        shell: bash
        run: |
          bun build src/index.ts \
            --outdir dist-bundle \
            --target node \
            --format esm \
            --external '@opencode-ai/plugin'
          find dist -name '*.js' -delete
          mv dist-bundle/index.js dist/index.js
          rm -rf dist-bundle
          find dist -type d -empty -delete

      - name: Prepare repository tarball metadata
        shell: bash
        run: |
          npm pkg set name="${GITHUB_REPOSITORY#*/}"
          npm pkg delete dependencies
          npm pkg delete devDependencies
          npm pkg delete scripts.prepare
          npm pkg set peerDependencies.@opencode-ai/plugin='*'

      - name: Pack self-contained tarball
        run: npm pack

      - name: Rename tarball to fixed name
        run: mv *.tgz opencode-kiro-auth.tgz

      - name: Verify the tarball installs and loads
        shell: bash
        run: |
          files=$(tar -tzf opencode-kiro-auth.tgz | wc -l)
          echo "tarball bevat ${files} files"
          if [ "$files" -gt 200 ]; then
            echo "::error::Tarball bevat ${files} files; de bundle-stap is niet effectief"
            exit 1
          fi

          smoke=$(mktemp -d)
          cd "$smoke"
          npm init -y >/dev/null
          npm install --no-audit --no-fund \
            "${GITHUB_WORKSPACE}/opencode-kiro-auth.tgz" \
            '@opencode-ai/plugin'

          node --input-type=module -e "
            const m = await import('opencode-kiro-auth');
            if (m.default?.id !== 'kiro') {
              throw new Error('default export mist id=kiro');
            }
            if (typeof m.default.server !== 'function') {
              throw new Error('default export mist de server hook');
            }
            console.log('ok: plugin laadt, id=' + m.default.id);
          "

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "_master" >/dev/null 2>&1; then
            echo "release_exists=true" >> $GITHUB_ENV
          else
            echo "release_exists=false" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release if missing
        if: env.release_exists != 'true'
        run: |
          gh release create "_master" \
            --target master \
            --prerelease \
            --title "Nightly Build master" \
            --notes "Nightly build. Commit: ${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure _master tag points at HEAD
        run: |
          git tag -f _master HEAD
          git push origin _master --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old tarball asset
        run: gh release delete-asset _master opencode-kiro-auth.tgz --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload tarball
        run: gh release upload _master opencode-kiro-auth.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
