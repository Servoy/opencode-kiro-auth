name: Release

# Never on its own. Publishing is a decision, not a consequence of tagging:
# run it from the Actions tab when the release is meant to go out.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      # A tag is the last place to find out the suite is red.
      - run: bun test

      - run: bun run typecheck

      - run: bun run build

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
